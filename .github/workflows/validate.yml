name: Validate engine vs OpenQuake

# The credibility gate: regenerate golden fixtures from real hazardlib, then
# assert the TypeScript engine matches them. Red here = the engine drifted from
# OpenQuake and must not ship.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- OpenQuake oracle ---
      # Pin to the version the committed fixtures were generated with (the
      # `oracle` field records it) so the drift check is byte-stable. Bump both
      # together when you regenerate fixtures against a newer OpenQuake.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: validation/requirements.txt
      - name: Install OpenQuake 3.16.1 (heavy — cached)
        run: |
          python -m pip install --upgrade pip
          pip install -r validation/requirements.txt
      # The fixture generator silently falls back to a provisional non-OQ mode
      # if hazardlib won't import — fail loudly here instead.
      - name: Assert hazardlib oracle is importable
        run: python -c "from openquake.hazardlib.mfd import EvenlyDiscretizedMFD; import importlib.metadata as md; print('oracle ok:', md.version('openquake.engine'))"
      - name: Regenerate golden fixtures from hazardlib
        run: python validation/generate_fixtures.py
      - name: Fail if committed fixtures drift from hazardlib
        run: git diff --exit-code validation/fixtures || (echo "::error::Committed fixtures differ from freshly generated OpenQuake fixtures. Run 'npm run fixtures' and commit." && exit 1)

      # --- TypeScript engine asserted equal ---
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test
      - run: npm run typecheck
